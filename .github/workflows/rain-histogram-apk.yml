name: Rain histogram APK

on:
  push:
    branches: [rain-histogram-download]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify live forecast map feed
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone
          url = "https://image.buienradar.nl/2.0/metadata/sprite/RadarMapRainWebmercatorNL?width=529&height=458&extension=png&renderBackground=false&renderText=false&renderBranding=false&history=1&forecast=24&skip=0"
          def request(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "WeatherBuddy/0.2 (+https://github.com/intramuros/weather-app)"}), timeout=30)
          with request(url) as response:
              data = json.load(response)
          times = data["times"]
          parsed = [datetime.fromisoformat(t["timestamp"].replace("Z", "+00:00")).replace(tzinfo=timezone.utc) for t in times]
          assert len(times) > 1, "No forecast frames"
          assert max(parsed) > datetime.now(timezone.utc), "Map feed has no future frames"
          with request(times[-1]["url"]) as response:
              assert response.read(8) == bytes.fromhex("89504e470d0a1a0a"), "Forecast image is not a PNG"
          print("Verified", len(times), "forecast images from", min(parsed).isoformat(), "through", max(parsed).isoformat())
          PY

      - name: Test, lint and build
        run: VERSION_CODE=$((67 + ${{ github.run_number }})) ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk weather-buddy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: weather-buddy-${{ github.run_number }}
          path: weather-buddy.apk

      # Publish this isolated feature build as a separate download.
      - name: Publish rain histogram APK
        if: github.ref == 'refs/heads/rain-histogram-download'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create rain-histogram-${{ github.run_number }} weather-buddy.apk \
            --target "$GITHUB_SHA" \
            --title "Rain histogram build (#${{ github.run_number }})" \
            --notes "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. Download weather-buddy.apk on your phone to install or update." \
            --prerelease --latest=false
